name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate repo
        run: |
          python tools/validate_repo.py

      - name: Lint markdown (structural)
        run: |
          python tools/lint_markdown.py

      - name: Check internal links
        run: |
          python tools/check_links.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate Mermaid diagrams
        run: |
          set -euo pipefail
          awk '/```mermaid/{flag=1;next}/```/{if(flag){flag=0;exit}}flag{print}' docs/architecture.md > /tmp/architecture.mmd
          printf '%s\n' '{"args":["--no-sandbox"]}' > /tmp/puppeteer-config.json
          npx --yes @mermaid-js/mermaid-cli@11.12.0 \
            --input /tmp/architecture.mmd \
            --output /tmp/architecture.svg \
            --puppeteerConfigFile /tmp/puppeteer-config.json
